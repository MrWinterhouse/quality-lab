name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:baseline
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artifacts-baseline
          path: artifacts/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v6
        if: always() && matrix.browser == 'chromium'
        with:
          name: artifacts-e2e
          path: artifacts/playwright.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-html-${{ matrix.browser }}
          path: artifacts/playwright-html/
          if-no-files-found: ignore

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run evals -- --gate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artifacts-evals
          path: artifacts/evals.json
          if-no-files-found: warn

  # The portfolio's hiring assistant: the golden dataset runs against the exact engine file
  # the published page loads. One failed case fails this job; the per-case report uploads
  # even then, so a red run can be read without the raw log.
  chatbot-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:chatbot
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artifacts-chatbot
          path: |
            artifacts/chatbot-eval.json
            artifacts/chatbot-eval.md
          if-no-files-found: warn

  python-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s python-oracle -p "test_*.py" -v

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run load
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artifacts-load
          path: artifacts/load.json
          if-no-files-found: warn

  # The seeded defects are part of the lab, so this job expects the probes, the shipping-prompt
  # gate and the release gate to report failures. It passes by recording that state in the job
  # summary and the published report, and fails on anything that is not the expected failure: a
  # check that cannot run, one that suddenly passes, or a report that cannot be built.
  release-readiness:
    needs: [baseline, e2e, evals, load, chatbot-evals]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      # Exit 1 is the expected result for the three checks below while the defects are open.
      # Each step also has to prove the check actually ran, and has to fail if it stops failing.
      - name: Known-defect probes (expected to fail while defects are open)
        run: |
          set +e
          npm run test:probes
          status=$?
          set -e
          if [ ! -s artifacts/junit-probes.xml ]; then
            echo "::error title=known-defect probes::The probe run wrote no JUnit output (exit $status)."
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error title=known-defect probes::The probes passed, so quality/known-gaps.json no longer matches the product."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error title=known-defect probes::The probe run exited $status instead of failing tests."
            exit 1
          fi
          echo "- Known-defect probes: failing as expected while the defects are open (\`artifacts/junit-probes.xml\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Accessibility probe (expected to fail while DEFECT-12 is open)
        run: |
          set +e
          npm run test:e2e:probes
          status=$?
          set -e
          if [ ! -s artifacts/playwright-probes.json ]; then
            echo "::error title=accessibility probe::The probe run wrote no Playwright JSON (exit $status)."
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error title=accessibility probe::The accessibility probe passed, so DEFECT-12 is fixed or the probe stopped asserting."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error title=accessibility probe::The probe run exited $status instead of failing tests."
            exit 1
          fi
          echo "- Accessibility probe: failing as expected while DEFECT-12 is open." >> "$GITHUB_STEP_SUMMARY"

      - name: Shipping prompt eval gate
        run: |
          set +e
          npm run evals -- --gate-shipping
          status=$?
          set -e
          if [ ! -s artifacts/evals.json ]; then
            echo "::error title=shipping prompt gate::The eval run wrote no artifacts/evals.json (exit $status)."
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error title=shipping prompt gate::The shipping prompt passed, so DEFECT-11 is fixed or the gate stopped asserting."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error title=shipping prompt gate::The eval run exited $status instead of failing the gate."
            exit 1
          fi
          echo "- Shipping prompt: below the eval threshold as expected while DEFECT-11 is open." >> "$GITHUB_STEP_SUMMARY"

      - name: Release gate
        run: |
          set +e
          npm run report -- --gate
          status=$?
          set -e
          node scripts/release-gate.mjs "$status"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artifacts-readiness
          path: artifacts/
          if-no-files-found: warn

  # release-readiness is a dependency because the report has to include the probe results it
  # records: without them the published summary says "probes: not run" while the hiring
  # assistant's knowledge base states 15 failing probes.
  quality-report:
    needs: [baseline, e2e, evals, load, chatbot-evals, release-readiness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - run: npm run report

      # A pull request regenerates the same summary and report, so it runs the same strict
      # check: stale figures fail review instead of merging and only failing at publish.
      - name: Check the assistant's figures against the evidence
        run: node scripts/check-chatbot-figures.mjs artifacts/summary.json artifacts/quality-report.md --strict
      - uses: actions/upload-artifact@v6
        with:
          name: quality-report
          path: |
            artifacts/quality-report.md
            artifacts/summary.json
          if-no-files-found: warn

  # Checks the portfolio site itself: HTML structure plus WCAG 2.1 A/AA via axe in Chromium.
  # Red when the site has a problem; the report still uploads, so the published page can
  # show the real number instead of a claim.
  site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:site
      - name: Exercise the hiring assistant page in a browser
        run: npm run check:chatbot-page
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: site-checks
          path: |
            artifacts/site-a11y.json
            artifacts/site-a11y.md
          if-no-files-found: warn

  # Publishes the static portfolio (site/) plus the artifacts from this run to GitHub Pages.
  # One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
  # Runs on every push to main, even when a suite is red: a portfolio that only publishes
  # green runs is a status page, not evidence.
  #
  # release-readiness is in needs because junit-probes.xml is only produced there; without it
  # the assembled site can point at a probe report that has not been uploaded yet.
  build-pages:
    needs: [quality-report, site-checks, release-readiness]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          touch _site/.nojekyll

      - name: Collect report artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: _site/reports
          merge-multiple: true

      - name: Collect the release-readiness report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: quality-report
          path: _site/reports

      - name: Collect the Playwright HTML report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: playwright-html-chromium
          path: _site/reports/playwright

      - name: Collect the site accessibility report
        uses: actions/download-artifact@v7
        with:
          name: site-checks
          path: _site/reports

      - name: Stamp the site with this run's figures
        run: node scripts/stamp-site.mjs _site _site/reports/summary.json

      # The hiring assistant answers with these figures, so its knowledge base has to agree
      # with the summary, the report, the page copy and the fixtures behind its case-study answers.
      # Strict: no report, no deploy.
      - name: Check the assistant's figures against the evidence
        run: node scripts/check-chatbot-figures.mjs _site/reports/summary.json _site/reports/quality-report.md --strict

      - name: Render the markdown reports as HTML
        run: |
          node scripts/render-report-html.mjs _site/reports/quality-report.md _site/reports/quality-report.html "Release readiness report" "npm run report"
          node scripts/render-report-html.mjs _site/reports/site-a11y.md _site/reports/site-a11y.html "Site accessibility and HTML checks" "npm run check:site"
          node scripts/render-report-html.mjs _site/reports/chatbot-eval.md _site/reports/chatbot-eval.html "Hiring assistant — golden-dataset evaluation" "npm run test:chatbot"

      # After assembly the reports exist, so every link must resolve. A dead evidence
      # link fails the deploy instead of shipping a page that points at nothing.
      - name: Verify the assembled site's links
        run: node scripts/check-site.mjs _site --strict --links-only

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploying is a separate job because upload-pages-artifact and deploy-pages in the same job
  # race: the lookup can run before the artifact is listed and fail with "No artifacts named
  # github-pages were found" even though the upload step is green.
  deploy-pages:
    needs: build-pages
    if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
