name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:baseline
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artifacts-baseline
          path: artifacts/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v6
        if: always() && matrix.browser == 'chromium'
        with:
          name: artifacts-e2e
          path: artifacts/playwright.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-html-${{ matrix.browser }}
          path: artifacts/playwright-html/
          if-no-files-found: ignore

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run evals -- --gate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artifacts-evals
          path: artifacts/evals.json
          if-no-files-found: warn

  python-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s python-oracle -p "test_*.py" -v

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run load
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artifacts-load
          path: artifacts/load.json
          if-no-files-found: warn

  # This job is the honest signal while the lab's seeded defects remain:
  # it runs the defect probes, the shipping-prompt gate and the release gate,
  # so it is expected to fail until the defects are fixed. It is non-blocking
  # for the pipeline so the baseline suites stay actionable.
  release-readiness:
    needs: [baseline, e2e, evals, load]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Known-defect probes (expected to fail while defects are open)
        continue-on-error: true
        run: npm run test:probes

      - name: Accessibility probe (expected to fail while DEFECT-12 is open)
        continue-on-error: true
        run: npm run test:e2e:probes

      - name: Shipping prompt eval gate
        continue-on-error: true
        run: npm run evals -- --gate-shipping

      - name: Release gate
        run: npm run report -- --gate

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artifacts-readiness
          path: artifacts/
          if-no-files-found: warn

  quality-report:
    needs: [baseline, e2e, evals, load]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - run: npm run report
      - uses: actions/upload-artifact@v6
        with:
          name: quality-report
          path: |
            artifacts/quality-report.md
            artifacts/summary.json
          if-no-files-found: warn

  # Checks the portfolio site itself: HTML structure plus WCAG 2.1 A/AA via axe in Chromium.
  # Red when the site has a problem; the report still uploads, so the published page can
  # show the real number instead of a claim.
  site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:site
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: site-checks
          path: |
            artifacts/site-a11y.json
            artifacts/site-a11y.md
          if-no-files-found: warn

  # Publishes the static portfolio (site/) plus the artifacts from this run to GitHub Pages.
  # One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
  # Runs on every push to main, even when a suite is red: a portfolio that only publishes
  # green runs is a status page, not evidence.
  #
  # release-readiness is in needs because junit-probes.xml is only produced there; without it
  # the assembled site can point at a probe report that has not been uploaded yet.
  build-pages:
    needs: [quality-report, site-checks, release-readiness]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          touch _site/.nojekyll

      - name: Collect report artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: _site/reports
          merge-multiple: true

      - name: Collect the release-readiness report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: quality-report
          path: _site/reports

      - name: Collect the Playwright HTML report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: playwright-html-chromium
          path: _site/reports/playwright

      - name: Collect the site accessibility report
        uses: actions/download-artifact@v7
        with:
          name: site-checks
          path: _site/reports

      - name: Stamp the site with this run's figures
        run: node scripts/stamp-site.mjs _site _site/reports/summary.json

      - name: Render the markdown reports as HTML
        run: |
          node scripts/render-report-html.mjs _site/reports/quality-report.md _site/reports/quality-report.html "Release readiness report" "npm run report"
          node scripts/render-report-html.mjs _site/reports/site-a11y.md _site/reports/site-a11y.html "Site accessibility and HTML checks" "npm run check:site"

      # After assembly the reports exist, so every link must resolve. A dead evidence
      # link fails the deploy instead of shipping a page that points at nothing.
      - name: Verify the assembled site's links
        run: node scripts/check-site.mjs _site --strict --links-only

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Deploying is a separate job because upload-pages-artifact and deploy-pages in the same job
  # race: the lookup can run before the artifact is listed and fail with "No artifacts named
  # github-pages were found" even though the upload step is green.
  deploy-pages:
    needs: build-pages
    if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
