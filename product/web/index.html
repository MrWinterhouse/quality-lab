<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Benefits screener</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span id="brandName">Benefits</span>
      </div>
      <button id="chatToggle" class="icon-btn" type="button" aria-expanded="false" aria-controls="chatPanel">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />
        </svg>
      </button>
    </header>

    <main id="main">
      <section class="panel" aria-labelledby="screenerTitle">
        <h1 id="screenerTitle">See what you may qualify for</h1>
        <p class="hint" id="screenerHint">
          Answer a few questions. We never share your information.
        </p>

        <form id="screenForm" novalidate>
          <div class="field">
            <label for="state">State</label>
            <select id="state" name="state">
              <option value="CA">California</option>
              <option value="NY">New York</option>
              <option value="TX">Texas</option>
              <option value="WA">Washington</option>
              <option value="CO">Colorado</option>
              <option value="FL">Florida</option>
              <option value="AK">Alaska</option>
              <option value="HI">Hawaii</option>
            </select>
          </div>

          <div class="field">
            <p class="field-label">Household size</p>
            <input
              id="householdSize"
              name="householdSize"
              type="number"
              min="1"
              max="12"
              value="4"
            />
          </div>

          <div class="field">
            <label for="monthlyIncome">Income before taxes</label>
            <input id="monthlyIncome" name="monthlyIncome" type="number" min="0" value="2000" />
          </div>

          <div class="field">
            <label for="frequency">How often are you paid?</label>
            <select id="frequency" name="frequency">
              <option value="monthly">Monthly</option>
              <option value="biweekly">Every two weeks</option>
              <option value="weekly">Weekly</option>
              <option value="hourly">Hourly</option>
              <option value="annual">Yearly</option>
            </select>
          </div>

          <div class="field checkbox">
            <input id="pregnant" type="checkbox" />
            <label for="pregnant">Someone in the household is pregnant</label>
          </div>

          <div class="field">
            <label for="youngChildren">Children under 5</label>
            <input id="youngChildren" type="number" min="0" max="6" value="1" />
          </div>

          <button type="submit" class="primary">Check eligibility</button>
          <p id="formError" class="error" role="alert" hidden></p>
        </form>
      </section>

      <section id="results" class="panel" hidden aria-labelledby="resultsTitle">
        <h2 id="resultsTitle">Programs you may qualify for</h2>
        <p id="resultsSummary" class="muted"></p>
        <div id="resultCards" class="cards"></div>
        <button id="startApplication" class="primary" type="button">Start an application</button>
      </section>

      <section id="application" class="panel" hidden aria-labelledby="applicationTitle">
        <h2 id="applicationTitle">Your application</h2>
        <p class="muted">
          Status: <strong id="applicationStatus" data-testid="status">submitted</strong>
        </p>
        <p class="muted">
          Documents due by <strong id="deadlineDate" data-testid="deadline-date"></strong>
        </p>

        <form id="documentForm">
          <div class="field">
            <label for="documentType">Document type</label>
            <select id="documentType">
              <option value="income_proof">Proof of income</option>
              <option value="id">Photo ID</option>
              <option value="residency">Proof of residency</option>
            </select>
          </div>
          <div class="field">
            <label for="documentFile">Choose a file</label>
            <input id="documentFile" type="file" accept=".pdf,.png,.jpg,.jpeg" />
          </div>
          <button type="submit" class="primary">Upload document</button>
        </form>

        <p id="documentMessage" class="muted" role="status"></p>

        <h3>Activity</h3>
        <ol id="timeline" class="timeline"></ol>
      </section>
    </main>

    <aside id="chatPanel" class="chat-panel" hidden aria-label="Benefits assistant">
      <div class="chat-head">
        <h2>Benefits assistant</h2>
        <button id="chatClose" class="icon-btn" type="button" aria-label="Close assistant">×</button>
      </div>
      <ul id="chatLog" class="chat-log" aria-live="polite"></ul>
      <form id="chatForm" class="chat-form">
        <label class="sr-only" for="chatInput">Message</label>
        <input id="chatInput" placeholder="Ask about a program" autocomplete="off" />
        <button type="submit" class="primary">Send</button>
      </form>
    </aside>

    <script type="module" src="/app.js"></script>
  </body>
</html>
